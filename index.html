<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f2f1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #0078d4;
      color: white;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    header svg { flex-shrink: 0; }
    .subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <header>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" fill="white" fill-opacity="0.2"/>
      <path d="M8 12C8 9.79 9.79 8 12 8s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4z" fill="white"/>
    </svg>
    <div>
      AI Assistant
      <div class="subtitle">Powered by Flowise</div>
    </div>
  </header>

  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js";
    Chatbot.init({
      chatflowid: "b83d1555-a57f-4ba7-a08a-76575a7b80d4",
      apiHost: "https://flowise-j4qo.onrender.com",
      theme: {
        button: {
          backgroundColor: "#0078d4",
          right: 32,
          bottom: 32,
          size: 56,
          iconColor: "white",
        },
        chatWindow: {
          title: "AI Assistant",
          titleAvatarSrc: "",
          welcomeMessage: "Hello! How can I help you today?",
          backgroundColor: "#ffffff",
          height: 600,
          width: 400,
          fontSize: 15,
          poweredByTextColor: "#9ca3af",
          botMessage: {
            backgroundColor: "#f0f4ff",
            textColor: "#1e293b",
          },
          userMessage: {
            backgroundColor: "#0078d4",
            textColor: "#ffffff",
          },
          textInput: {
            placeholder: "Type your question...",
            backgroundColor: "#ffffff",
            textColor: "#1e293b",
            sendButtonColor: "#0078d4",
          },
        },
      },
    });
  </script>

</body>
</html>
