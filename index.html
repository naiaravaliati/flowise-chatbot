<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f2f1;
    }
    flowise-fullchatbot {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <flowise-fullchatbot></flowise-fullchatbot>

  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js";
    Chatbot.initFull({
      chatflowid: "b83d1555-a57f-4ba7-a08a-76575a7b80d4",
      apiHost: "https://flowise-j4qo.onrender.com",
      theme: {
        chatWindow: {
          title: "AI Assistant",
          welcomeMessage: "Hello! How can I help you today?",
          backgroundColor: "#ffffff",
          fontSize: 15,
          poweredByTextColor: "#9ca3af",
          botMessage: {
            backgroundColor: "#f0f4ff",
            textColor: "#1e293b",
          },
          userMessage: {
            backgroundColor: "#0078d4",
            textColor: "#ffffff",
          },
          textInput: {
            placeholder: "Type your question...",
            backgroundColor: "#ffffff",
            textColor: "#1e293b",
            sendButtonColor: "#0078d4",
          },
        },
      },
    });
  </script>

</body>
</html>
